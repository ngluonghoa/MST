name: MST A03 SSI DNSE M5 Timestamp Labels - UNVERIFIED NO GO

on:
  pull_request:
    paths:
      - ".github/workflows/m2-a03-ssi-dnse-m5-timestamp-labels.yml"
      - "scripts/m2_a03_endpoint_m5_timestamp_semantics_lab.py"
      - "tests/test_m2_a03_endpoint_m5_timestamp_semantics_lab.py"
      - "docs/MST_A03_SSI_DNSE_M5_TIMESTAMP_QA_20261110.md"

permissions:
  contents: read

jobs:
  original-source-locked-ssi-dnse-m5-time-label:
    if: ${{ github.repository == 'ngluonghoa/MST' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original and existing V2 synthetic package
        run: python -m pip install -e .
      - name: Remote lock unchanged 63 V1 and 8 V2 source bytes against upstream and main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.mst_remote_legacy_tree_lock --out /tmp/mst-a03-m5-source-lock.json
      - name: Execute 35 source endpoint timestamp ambiguity tests
        run: python -m unittest discover -s tests -p 'test_m2_a03_endpoint_m5_timestamp_semantics_lab.py' -v
      - name: Reproduce 18 untrusted M5 source-time interpretations and NO GO
        run: |
          python -m scripts.m2_a03_endpoint_m5_timestamp_semantics_lab --out /tmp/mst-a03-m5-time-label-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/mst-a03-m5-time-label-NO-GO.json").read_text())
          lock=json.loads(Path("/tmp/mst-a03-m5-source-lock.json").read_text())
          assert lock["all_inherited_package_paths_unchanged_on_pr"] is True
          assert lock["original_python_module_count"]==63
          assert lock["approved_opt_in_v2_sidecar_module_count"]==8
          assert r["count"]==18
          assert r["real_issuer_or_entitlement"]=="NOT_RECEIVED"
          for k in ("ssi_m5_resolution_proven","ssi_start_end_semantic_proven",
                    "dnse_start_end_semantic_proven","licensed_vendor_source_proven",
                    "official_calendar_and_auction_proven","first_known_origin_proven",
                    "drive_market_cache_authorized","v1_v2_original_modified",
                    "owner_a02_63_approved","owner_a03_v2_8_approved",
                    "owner_a03_14_approved","production_authorized",
                    "trading_authorized"):
              assert r[k] is False,k
          print("M5 START/END AMBIGUITY REPRODUCED; NO LIVE VENDOR AUTHORITY")
          PY
      - name: Save only 14-day synthetic and source-lock receipt
        uses: actions/upload-artifact@v4
        with:
          name: mst-a03-ssi-dnse-m5-label-NO-GO
          path: |
            /tmp/mst-a03-m5-source-lock.json
            /tmp/mst-a03-m5-time-label-NO-GO.json
          retention-days: 14
          if-no-files-found: error
