name: MST MFX-style app-owned Drive and SSI/DNSE gated source - MANUAL DRAFT

# No schedule, PR, push, stock orders or repository writes.
# Source-stage upload requires independent per-run owner and rights gates.
# This workflow is NOT callable on main until separately reviewed/merged.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "OAuth Drive probe, SSI/DNSE readonly, or rights-gated DNSE unpublished quarantine"
        required: true
        type: choice
        default: drive-probe
        options:
          - drive-probe
          - dnse-d1-readonly
          - dnse-d1-quarantine-stage
          - dnse-native-quarantine-stage
          - ssi-d1-readonly
          - dnse-native-readonly
          - ssi-native-readonly
      native_tf:
        description: "Native source time frame for native-readonly/native-quarantine modes (no H4)"
        required: true
        type: choice
        default: D1
        options:
          - D1
          - M5
          - M15
          - M30
          - H1
      symbol:
        description: "FPT/DCM/HPG symbol for owner-gated market-data probe"
        required: false
        default: FPT
        type: choice
        options:
          - FPT
          - DCM
          - HPG
      from_unix:
        description: "DNSE source starting UNIX timestamp (requires source entitlement)"
        required: false
        type: string
      to_unix:
        description: "DNSE source ending UNIX timestamp"
        required: false
        type: string
      previous_dnse_d1_file_id:
        description: "Optional exact prior UNPUBLISHED private DNSE D1 chunk id for append-only delta; empty for first capture"
        required: false
        type: string
      from_date:
        description: "SSI start date, YYYY-MM-DD (bounded by native TF)"
        required: false
        type: string
      to_date:
        description: "SSI end date, YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mst-mfx-style-readonly-cloud-owner
  cancel-in-progress: false

jobs:
  exact-app-owned-readonly:
    name: Manual app-owned folder proof, SSI/DNSE native read or gated quarantine
    if: ${{ github.repository == 'ngluonghoa/MST' && github.repository_id == '1450356304' && github.repository_owner_id == '353049266' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.MST_MFX_APP_OWNED_READONLY_ACCEPTED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned read-only OAuth and HTTPS dependencies
        run: python -m pip install --disable-pip-version-check google-auth==2.43.0 requests==2.32.5
      - name: Validate app-owned Drive and selected official provider source
        env:
          MST_MFX_SOURCE_MODE: ${{ inputs.mode }}
          MST_SOURCE_TF: ${{ inputs.native_tf }}
          MST_MFX_APP_OWNED_READONLY_ACCEPTED: ${{ vars.MST_MFX_APP_OWNED_READONLY_ACCEPTED }}
          MST_OAUTH_BOOTSTRAP_ACCEPTED: ${{ vars.MST_OAUTH_BOOTSTRAP_ACCEPTED }}
          MST_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.MST_GDRIVE_OAUTH_CLIENT_ID }}
          MST_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.MST_GDRIVE_OAUTH_CLIENT_SECRET }}
          MST_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.MST_GDRIVE_OAUTH_REFRESH_TOKEN }}
          MST_DNSE_READONLY_OWNER_ACCEPTED: ${{ vars.MST_DNSE_READONLY_OWNER_ACCEPTED }}
          MST_DNSE_SOURCE_RIGHTS_CONFIRMED: ${{ vars.MST_DNSE_SOURCE_RIGHTS_CONFIRMED }}
          MST_DNSE_API_KEY: ${{ startsWith(inputs.mode, 'dnse-') && secrets.MST_DNSE_API_KEY || '' }}
          MST_DNSE_API_SECRET: ${{ startsWith(inputs.mode, 'dnse-') && secrets.MST_DNSE_API_SECRET || '' }}
          MST_DNSE_SYMBOL: ${{ inputs.symbol }}
          MST_DNSE_FROM_UNIX: ${{ inputs.from_unix }}
          MST_DNSE_PREVIOUS_SOURCE_FILE_ID: ${{ inputs.previous_dnse_d1_file_id }}
          MST_DNSE_TO_UNIX: ${{ inputs.to_unix }}
          MST_MFX_SOURCE_QUARANTINE_WRITE_ACCEPTED: ${{ vars.MST_MFX_SOURCE_QUARANTINE_WRITE_ACCEPTED }}
          MST_DNSE_STORAGE_RIGHTS_CONFIRMED: ${{ vars.MST_DNSE_STORAGE_RIGHTS_CONFIRMED }}
          MST_SSI_READONLY_OWNER_ACCEPTED: ${{ vars.MST_SSI_READONLY_OWNER_ACCEPTED }}
          MST_SSI_SOURCE_RIGHTS_CONFIRMED: ${{ vars.MST_SSI_SOURCE_RIGHTS_CONFIRMED }}
          MST_SSI_API_KEY: ${{ startsWith(inputs.mode, 'ssi-') && secrets.MST_SSI_API_KEY || '' }}
          MST_SSI_API_SECRET: ${{ startsWith(inputs.mode, 'ssi-') && secrets.MST_SSI_API_SECRET || '' }}
          MST_SSI_SYMBOL: ${{ inputs.symbol }}
          MST_SSI_FROM_DATE: ${{ inputs.from_date }}
          MST_SSI_TO_DATE: ${{ inputs.to_date }}
        run: python -m scripts.mst_mfx_style_appowned_pipeline
