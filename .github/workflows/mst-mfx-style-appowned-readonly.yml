name: MST MFX-style app-owned Drive and DNSE read-only preflight - MANUAL DRAFT

# No schedule, PR, push, Drive create/upload, stock orders or repository writes.
# This workflow is NOT callable on main until separately reviewed/merged.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "drive-probe or separately owner-authorized dnse-d1-readonly"
        required: true
        type: choice
        default: drive-probe
        options:
          - drive-probe
          - dnse-d1-readonly
      symbol:
        description: "DNSE symbol for read-only D1 probe, never used in log"
        required: false
        default: FPT
        type: choice
        options:
          - FPT
          - DCM
          - HPG
      from_unix:
        description: "DNSE D1 starting UNIX timestamp (if source access independently approved)"
        required: false
        type: string
      to_unix:
        description: "DNSE D1 ending UNIX timestamp"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mst-mfx-style-readonly-cloud-owner
  cancel-in-progress: false

jobs:
  exact-app-owned-readonly:
    name: Manual OAuth app folder proof and optional official DNSE read
    if: ${{ github.repository == 'ngluonghoa/MST' && github.repository_id == '1450356304' && github.repository_owner_id == '353049266' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.MST_MFX_APP_OWNED_READONLY_ACCEPTED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned read-only OAuth and HTTPS dependencies
        run: python -m pip install --disable-pip-version-check google-auth==2.43.0 requests==2.32.5
      - name: Validate app-owned Drive folders and optional official DNSE D1 source
        env:
          MST_MFX_SOURCE_MODE: ${{ inputs.mode }}
          MST_MFX_APP_OWNED_READONLY_ACCEPTED: ${{ vars.MST_MFX_APP_OWNED_READONLY_ACCEPTED }}
          MST_OAUTH_BOOTSTRAP_ACCEPTED: ${{ vars.MST_OAUTH_BOOTSTRAP_ACCEPTED }}
          MST_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.MST_GDRIVE_OAUTH_CLIENT_ID }}
          MST_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.MST_GDRIVE_OAUTH_CLIENT_SECRET }}
          MST_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.MST_GDRIVE_OAUTH_REFRESH_TOKEN }}
          MST_DNSE_READONLY_OWNER_ACCEPTED: ${{ vars.MST_DNSE_READONLY_OWNER_ACCEPTED }}
          MST_DNSE_SOURCE_RIGHTS_CONFIRMED: ${{ vars.MST_DNSE_SOURCE_RIGHTS_CONFIRMED }}
          MST_DNSE_API_KEY: ${{ secrets.MST_DNSE_API_KEY }}
          MST_DNSE_API_SECRET: ${{ secrets.MST_DNSE_API_SECRET }}
          MST_DNSE_SYMBOL: ${{ inputs.symbol }}
          MST_DNSE_FROM_UNIX: ${{ inputs.from_unix }}
          MST_DNSE_TO_UNIX: ${{ inputs.to_unix }}
        run: python -m scripts.mst_mfx_style_appowned_pipeline
