name: MST A03 Three Sources Six TF VCBS Minute Price Negative QA

on:
  pull_request:
    paths:
      - ".github/workflows/m2-a03-three-source-vcbs-capability.yml"
      - "scripts/m2_a03_three_source_vcbs_capability_lab.py"
      - "scripts/m2_a03_connected_source_freshness_lab.py"
      - "tests/test_m2_a03_connected_source_freshness_lab.py"
      - "tests/test_m2_a03_three_source_vcbs_capability_lab.py"
      - "docs/MST_A03_THREE_SOURCE_VCBS_CAPABILITY_QA_20261110.md"

permissions:
  contents: read

jobs:
  vcbs-source-capability-original-bytes-unmodified:
    if: ${{ github.repository == 'ngluonghoa/MST' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unchanged inherited and opt-in package
        run: python -m pip install -e .
      - name: Lock original Swing 63 V1 plus 8 V2 source bytes against upstream main PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.mst_remote_legacy_tree_lock --out /tmp/mst-three-source-lock.json
      - name: Run 64 SSI DNSE source-mode and VCBS source-capability tests
        run: python -m unittest discover -s tests -p 'test_m2_a03_three_source_vcbs_capability_lab.py' -v
      - name: Run 24 SSI latest/session clock and cross-provider comparability tests
        run: python -m unittest discover -s tests -p 'test_m2_a03_connected_source_freshness_lab.py' -v
      - name: Validate synthetic source clock, asof and last-M5 comparability NO GO
        run: |
          python -m scripts.m2_a03_connected_source_freshness_lab --out /tmp/mst-source-clock-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/mst-source-clock-NO-GO.json").read_text())
          assert d["status"]=="CONNECTOR_ASOF_IS_NOT_VENDOR_FIRST_KNOWN_NO_GO"
          assert d["synthetic_ssi"]["syntactic_lag_seconds"]==900
          assert d["synthetic_ssi"]["signal_eligible"] is False
          assert d["exchange_calendar_freshness_age_limit"] is None
          assert d["source_bar_rows_persisted"] is False
          assert len(d["cross_mode_pairs"])==3
          assert all(p["permitted_to_confirm_latest_m5"] is False for p in d["cross_mode_pairs"])
          for k in ("source_issuer_clock_authenticated","source_first_known_authenticated",
                   "official_calendar_and_session_open_verified",
                   "native_m5_closed_bar_verified",
                   "cross_provider_same_native_timeframe_verified",
                   "source_rights_verified","physical_google_drive_cache_authorized",
                   "owner_a02_63_approved","owner_a03_v2_8_approved",
                   "owner_a03_14_approved","production_release_authorized",
                   "trading_authorized"):
              assert d[k] is False,k
          print("CONNECTOR META ASOF != PUBLISHER FIRST-KNOWN; CROSS-MODE M5 NO-GO")
          PY
      - name: Ensure all 18 rows and VCBS price-only fixture remain NO GO
        run: |
          python -m scripts.m2_a03_three_source_vcbs_capability_lab --out /tmp/mst-three-source-vcbs-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/mst-three-source-vcbs-NO-GO.json").read_text())
          lock=json.loads(Path("/tmp/mst-three-source-lock.json").read_text())
          assert lock["all_inherited_package_paths_unchanged_on_pr"] is True
          assert lock["original_python_module_count"] == 63
          assert lock["approved_opt_in_v2_sidecar_module_count"] == 8
          assert r["provider_count"] == 3 and r["timeframe_count"] == 6
          assert r["rows_count"] == 18 and len(r["rows"]) == 18
          assert r["vcbs_fabricated_probe"]["synthetic_points"] == 3
          assert r["vcbs_fabricated_probe"]["source_has_per_candle_ohlcv"] is False
          assert r["vcbs_fabricated_probe"]["valid_for_signal_indicators"] is False
          p=r["ssi_dnse_synthetic_mode_probe"]
          assert p["ssi_original_c2_shape"]=="SHAPE_RETURNED"
          assert p["ssi_synthetic_rows"]==3
          assert p["ssi_raw_date_semantic_authenticated"] is False
          assert p["ssi_ambiguous_latest_token_inferred"] is False
          assert p["dnse_original_c2_shape"]=="SHAPE_RETURNED"
          assert p["dnse_synthetic_d1_rows"]==3
          assert p["dnse_connected_minute_ohlcv_blocked"] is True
          assert p["real_source_payload_persisted"] is False
          assert all(row["qualified_native_ohlcv"] is False and
                     row["signal_eligible"] is False for row in r["rows"])
          for key in ("native_minute_ohlcv_connected_and_qualified",
                      "independent_vendor_issuer_verified","publisher_first_known_verified",
                      "official_calendar_and_timestamp_semantics_verified",
                      "source_rights_and_retention_approved","real_drive_market_cache_authorized",
                      "upstream_v1_or_v2_modified","a02_63_approved","a03_v2_8_approved",
                      "a03_14_approved","production_release_authorized","trading_authorized"):
              assert r[key] is False,key
          print("VCBS PRICE POINTS REMAIN REFERENCE ONLY; ALL 18 TF CELLS NO GO")
          PY
      - name: Retain fabricated-only source lock and six-TF receipt for fourteen days
        uses: actions/upload-artifact@v4
        with:
          name: mst-a03-three-source-six-tf-vcbs-NO-GO
          path: |
            /tmp/mst-three-source-lock.json
            /tmp/mst-three-source-vcbs-NO-GO.json
            /tmp/mst-source-clock-NO-GO.json
          retention-days: 14
          if-no-files-found: error
