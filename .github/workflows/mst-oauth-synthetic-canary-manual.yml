name: MST OAuth synthetic STAGING_ONLY SHA256 canary - MANUAL PRIVATE WRITE

# §220: manual protected-main only, synthetic canary only, never stock data.
# No schedule, push, pull_request, market APIs, Cache promotion or trading.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Creates ONE fictional JSON in private STAGING_ONLY and keeps it for audit'
        required: true
        type: choice
        default: 'NO'
        options:
          - 'NO'
          - 'WRITE_SYNTHETIC_STAGING_ONLY'

permissions:
  contents: read

# Share with the §219 census workflow to avoid concurrent inventory/write.
concurrency:
  group: mst-oauth-appowned-cache-census-manual
  cancel-in-progress: false

jobs:
  private-synthetic-staging-canary:
    name: Owner-confirmed synthetic JSON upload + exact SHA256 readback
    if: ${{ github.repository == 'ngluonghoa/MST' && github.repository_id == '1450356304' && github.repository_owner_id == '353049266' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'WRITE_SYNTHETIC_STAGING_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout protected main without persistent GitHub credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Google OAuth and HTTPS dependencies
        run: python -m pip install --disable-pip-version-check google-auth==2.43.0 requests==2.32.5
      - name: Private synthetic STAGING_ONLY write and SHA256 readback
        env:
          MST_CANARY_CONFIRM: ${{ inputs.confirm }}
          MST_OAUTH_MODE: probe
          MST_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.MST_GDRIVE_OAUTH_CLIENT_ID }}
          MST_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.MST_GDRIVE_OAUTH_CLIENT_SECRET }}
          MST_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.MST_GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python -m scripts.mst_oauth_synthetic_canary220
