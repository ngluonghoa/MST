          assert a["status"]=="SIX_TF_ALL_ATR14_NUMERIC_ORACLE_MULTIDAY_FIXTURE_ONLY_NO_GO"
          assert a["window_counts"]=={"M5":768,"M15":256,"M30":128,"H1":64,"H4":16,"D1":16}
