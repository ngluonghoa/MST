name: MST A03 Full-Policy V2 Manifest Local Chain - SYNTHETIC NO APPLY

# Cloud-hosted only, no real Google Drive cache or source data I/O.
# A passing local SHA chain cannot prove signer custody, immutable floor or CAS.
on:
  pull_request:
    paths:
      - ".github/workflows/m2-a03-v2-manifest-full-policy-local-chain.yml"
      - "scripts/m2_a03_v2_full_policy_manifest_draft.py"
      - "tests/test_m2_a03_v2_full_policy_manifest_draft.py"
      - "docs/MST_A03_V2_FULL_POLICY_MANIFEST_CHAIN_QA_20261109.md"
      - "scripts/m4_v21_layered_invalidation_lab.py"
      - "tests/test_m4_v21_layered_invalidation_lab.py"
      - "docs/MST_M4_CACHE_V21_OWNER_APPROVED_ROADMAP_20261111.md"
      - "scripts/m4_v21_six_tf_causal_slices.py"
      - "tests/test_m4_v21_six_tf_causal_slices.py"
      - "docs/MST_M4_V21_SIX_TF_CAUSAL_SLICES_QA_20261111.md"
      - "scripts/m4_v21_gap_v1_numeric_parity_lab.py"
      - "tests/test_m4_v21_gap_v1_numeric_parity_lab.py"
      - "docs/MST_M4_V21_GAP_V1_NUMERIC_PARITY_QA_20261111.md"
      - "scripts/m4_v21_multiday_all_tf_atr14_oracle_lab.py"
      - "tests/test_m4_v21_multiday_all_tf_atr14_oracle_lab.py"
      - "docs/MST_M4_V21_16DAY_SIX_TF_ATR14_ORACLE_QA_20261111.md"
      - "scripts/m4_v21_daily_partition_checkpoint_chain_lab.py"
      - "tests/test_m4_v21_daily_partition_checkpoint_chain_lab.py"
      - "docs/MST_M4_V21_DAILY_PARTITION_CARRY_QA_20261111.md"
      - "scripts/m4_v21_source_revision_asof_ledger_lab.py"
      - "tests/test_m4_v21_source_revision_asof_ledger_lab.py"
      - "docs/MST_M4_V21_BITEMPORAL_SOURCE_CUSTODY_QA_20261111.md"

permissions:
  contents: read

jobs:
  full-policy-lineage-and-first-known-review:
    name: Rights/indicator scoped revision chain, old-as-of denial, no external floor
    if: ${{ github.repository == 'ngluonghoa/MST' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-locked package
        run: python -m pip install -e ".[custody]"
      - name: Execute V1 numerical oracle backed V2 candidate manifest chain
        run: |
          python -m scripts.m2_a03_v2_full_policy_manifest_draft \
            --out /tmp/mst-v2-full-policy-manifest-local-chain-no-auth.json
      - name: Run 28 test-only Cache V2.1 full-policy layered recompute controls
        run: python -m unittest discover -s tests -p 'test_m4_v21_layered_invalidation_lab.py' -v
      - name: Demonstrate bounded dependent-only recompute, lineage-only reuse and unknown quarantine
        run: |
          python -m scripts.m4_v21_layered_invalidation_lab --out /tmp/mst-v21-layer-impact-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/mst-v21-layer-impact-NO-GO.json").read_text())
          assert d["status"]=="FULL_POLICY_LAYER_INVALIDATION_PREVIEW_SOURCE_AND_DRIVE_NO_GO"
          assert len(d["fixture_value_correction"]["impacted_nodes"])==6
          assert len(d["fixture_metadata_revision"]["impacted_nodes"])==2
          assert len(d["unqualified_change_quarantine"]["impacted_nodes"])==9
          assert d["provider_market_source_verified"] is False
          assert d["actual_drive_cache_published"] is False
          assert d["governance_p0_owner_release_approved"] is False
          print("V2.1 P0 PLAN PASS SYNTHETIC; MARKET DATA AND DRIVE NO-GO")
          PY
      - name: Run 44 six-TF M5-to-M15-M30-H1-H4-D1 causal synthetic tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_six_tf_causal_slices.py' -v
      - name: Validate artificial six-TF closed-window and indicator-tail receipt is no-go
        run: |
          python -m scripts.m4_v21_six_tf_causal_slices --out /tmp/mst-v21-six-tf-slices-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/mst-v21-six-tf-slices-NO-GO.json").read_text())
          assert r["status"]=="SIX_TF_M5_DEPENDENCY_AND_CAUSAL_SUFFIX_SYNTHETIC_NO_GO"
          assert r["six_tf_total_artificial_closed_windows"]==155
          v=r["value_revision"]["timeframes"]
          assert {k:v[k]["numerical_bar_windows_recompute"] for k in ("M5","M15","M30","H1","H4","D1")}=={"M5":[15],"M15":[5],"M30":[2],"H1":[1],"H4":[0],"D1":[0]}
          assert sum(len(x["causal_indicator_checkpoints_recompute"]) for x in v.values())==132
          assert sum(len(x["quarantined_window_ordinals"]) for x in r["unqualified_provider_change"]["timeframes"].values())==155
          for case in ("value_revision","metadata_revision","unqualified_provider_change","unchanged_fixture"):
              c=r[case]
              for k in ("numeric_indicators_actually_recomputed","provider_published_first_known_verified",
                        "official_vn_calendar_and_auction_finality_verified","authorized_real_higher_tf_source_data",
                        "real_drive_cache_read_write_performed","remote_multiwriter_cas_or_protected_floor_verified",
                        "production_reuse_or_trading_allowed"):
                  assert c[k] is False, (case,k)
          assert r["no_real_google_drive_or_vendor_market_calls"] is True
          assert r["release_and_trading_no_go"] is True
          print("SIX TF 44 CASES SYNTHETIC, CALENDAR AND DRIVE NO-GO")
          PY
      - name: Run 46 strict gap-aware six-TF V1 numeric EMA20 ATR14 parity tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_gap_v1_numeric_parity_lab.py' -v
      - name: Validate inherited V1 incremental vs independent actual Decimal oracle on gap
        run: |
          python -m scripts.m4_v21_gap_v1_numeric_parity_lab --out /tmp/mst-v21-gap-v1-numeric-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/mst-v21-gap-v1-numeric-NO-GO.json").read_text())
          assert x["status"]=="GAPPED_M5_SIX_TF_V1_EMA_ATR_NUMERIC_PARITY_FIXTURE_ONLY"
          assert x["source_m5_count"]==48
          assert x["toy_tf_window_counts"]=={"M5":48,"M15":16,"M30":8,"H1":4,"H4":1,"D1":1}
          assert x["nontrading_break_minutes"]==120
          assert x["total_price_correction_checkpoint_suffix_positions"]==48
          assert x["inherited_v1_sqlite_incremental_numerically_matches_independent_ema20_atr14"] is True
          assert all(a["metadata_only_zero_recompute"] for a in x["tf_evidence"].values())
          for k in ("source_license_verified","official_hose_hnx_upcom_historical_calendar_verified",
                    "real_provider_aggregation_and_correction_proven","real_source_first_known_verified",
                    "physical_google_drive_quote_cache_read_write",
                    "cross_run_authenticated_writer_or_protected_cas_floor",
                    "live_signal_release_or_trading_authorized"):
              assert x[k] is False,k
          print("GAPPED V1 NUMERIC/INDEPENDENT ORACLE PASS; ALL REAL MARKET GATES NO-GO")
          PY
      - name: Run 55 full six-TF numerical ATR14 16-day synthetic V1-only replay tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_multiday_all_tf_atr14_oracle_lab.py' -v
      - name: Validate 16-day actual inherited V1 six-TF ATR14 numeric oracle and no-go
        run: |
          python -m scripts.m4_v21_multiday_all_tf_atr14_oracle_lab --out /tmp/mst-v21-16day-six-tf-atr14-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("/tmp/mst-v21-16day-six-tf-atr14-NO-GO.json").read_text())
          assert a["status"]=="SIX_TF_ALL_ATR14_NUMERIC_ORACLE_MULTIDAY_FIXTURE_ONLY_NO_GO"
          assert a["window_counts"]=={"M5":768,"M15":256,"M30":128,"H1":64,"H4":16,"D1":16}
          assert a["total_toy_closed_derived_windows"]==1248
          assert a["actual_v1_indicator_checkpoint_suffix_recomputed"]==204
          assert a["all_six_tf_atr14_has_numerical_values_after_fourteen_closed_bars"] is True
          assert a["v2_multiday_candidate_scope_approved"] is False
          assert a["sixteen_day_v1_fingerprint_only_not_v2_manifest"] is True
          assert a["all_six_tf_independent_ema20_atr14_oracle_equal"] is True
          assert a["metadata_only_zero_numeric_indicator_recompute_all_six"] is True
          assert {k:v["numeric_checkpoint_suffix_recomputed"] for k,v in a["per_tf"].items()}=={"M5":124,"M15":42,"M30":21,"H1":11,"H4":3,"D1":3}
          for k in ("history_source_issuer_verified","official_vn_exchange_historical_calendar_verified",
                    "official_h4_d1_provider_aggregation_verified",
                    "licensed_market_data_retention_or_cache_approved",
                    "google_drive_market_ohlcv_io_performed",
                    "independent_multiwriter_cas_signer_highwater_floor_verified",
                    "release_or_trading_authorized"):
              assert a[k] is False,k
          print("MULTIDAY SIX-TF ATR14 V1 NUMERIC ORACLE PASS; NO REAL MARKET CACHE/TRADE RIGHTS")
          PY
      - name: Run 35 daily V2 candidate partition chain and inherited V1 carry guard tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_daily_partition_checkpoint_chain_lab.py' -v
      - name: Verify 96 one-date links and six-TF EMA/ATR rolling state without source authorization
        run: |
          python -m scripts.m4_v21_daily_partition_checkpoint_chain_lab --out /tmp/mst-v21-daily-carry-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/mst-v21-daily-carry-NO-GO.json").read_text())
          assert x["status"]=="SINGLE_DATE_V2_SCOPE_CHAIN_SYNTHETIC_ONLY_ALL_LIVE_GATES_NO_GO"
          assert x["fake_days"]==16
          assert x["candidate_single_date_partition_links"]==96
          assert x["total_cold_checkpoints"]==1248
          assert x["actual_price_replayed_checkpoint_positions"]==204
          assert x["metadata_only_replayed_checkpoint_positions"]==0
          assert x["cross_date_carry_numerically_equal_original_v1"] is True
          assert x["one_day_v1_v2_guard_unmodified"] is True
          assert x["multi_day_composite_v2_scope_allowed"] is False
          for flag in ("official_exchange_calendar_authenticated",
                       "provider_issued_first_known_revision_authenticated",
                       "market_data_or_cloud_retention_licensed",
                       "physical_google_drive_market_cache_read_write",
                       "protected_external_monotonic_floor_or_two_writer_cas",
                       "production_release_or_trading_authorized"):
              assert x[flag] is False,flag
          print("P0 SINGLE-DATE V2 CARRY FIXTURE PASS, LIVE SOURCE AND DRIVE NO-GO")
          PY
      - name: Run 47 synthetic as-of revision and first-known custody tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_source_revision_asof_ledger_lab.py' -v
      - name: Verify three bitemporal views and preserve source licensing NO-GO
        run: |
          python -m scripts.m4_v21_source_revision_asof_ledger_lab --out /tmp/mst-v21-first-known-asof-NO-GO.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/mst-v21-first-known-asof-NO-GO.json").read_text())
          assert x["status"]=="SOURCE_REVISION_ASOF_CUSTODY_FIXTURE_ONLY_ALL_LIVE_GATES_NO_GO"
          assert x["untrusted_ledger_events"]==770
          assert x["declared_synthetic_m5_source_rows"]==768
          assert x["revision_history_asof_snapshots"]==3
          assert x["value_revision_invisible_before_known"] is True
          assert x["metadata_only_zero_numeric_recompute"] is True
          assert x["six_tf_asof_numeric_oracle_verified"] is True
          proof=x["source_proof"]
          for flag in ("issuer_signature_authenticated",
                       "official_market_calendar_attested",
                       "authorized_real_source_retention",
                       "independent_protected_rollback_floor",
                       "external_concurrent_writer_cas",
                       "read_write_real_google_drive_quotes",
                       "production_or_trading_permitted"):
              assert proof[flag] is False,flag
          print("ASOF M3/M4 CUSTODY LAB SYNTHETIC PASS; REAL ISSUER AND GOOGLE DRIVE CACHE NO-GO")
          PY
      - name: Archive temporary untrusted design evidence only
        uses: actions/upload-artifact@v4
        with:
          name: mst-a03-manifest-full-policy-local-chain-NO-AUTH
          path: |
            /tmp/mst-v2-full-policy-manifest-local-chain-no-auth.json
            /tmp/mst-v21-layer-impact-NO-GO.json
            /tmp/mst-v21-six-tf-slices-NO-GO.json
            /tmp/mst-v21-gap-v1-numeric-NO-GO.json
            /tmp/mst-v21-16day-six-tf-atr14-NO-GO.json
            /tmp/mst-v21-daily-carry-NO-GO.json
            /tmp/mst-v21-first-known-asof-NO-GO.json
          retention-days: 14
          if-no-files-found: error
