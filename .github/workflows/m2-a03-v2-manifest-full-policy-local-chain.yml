          PY
      - name: Run 35 daily V2 candidate partition chain and inherited V1 carry guard tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_daily_partition_checkpoint_chain_lab.py' -v
      - name: Verify 96 one-date links and six-TF EMA/ATR rolling state without source authorization
