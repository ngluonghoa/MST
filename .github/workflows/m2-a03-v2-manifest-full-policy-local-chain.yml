            /tmp/mst-m3-vendor-public-doc-rights-NO-GO.json
            /tmp/mst-private-pilot-d1-contract-SYNTHETIC-NO-GO.json
            /tmp/mst-m4-drive-oidc-identity-SYNTHETIC-NO-GO.json
