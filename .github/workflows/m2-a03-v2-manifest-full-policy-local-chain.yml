name: MST A03 Full-Policy V2 Manifest Local Chain - SYNTHETIC NO APPLY

# Cloud-hosted only, no real Google Drive cache or source data I/O.
# A passing local SHA chain cannot prove signer custody, immutable floor or CAS.
on:
  pull_request:
    paths:
      - ".github/workflows/m2-a03-v2-manifest-full-policy-local-chain.yml"
      - "scripts/m2_a03_v2_full_policy_manifest_draft.py"
      - "tests/test_m2_a03_v2_full_policy_manifest_draft.py"
      - "docs/MST_A03_V2_FULL_POLICY_MANIFEST_CHAIN_QA_20261109.md"

permissions:
  contents: read

jobs:
  full-policy-lineage-and-first-known-review:
    name: Rights/indicator scoped revision chain, old-as-of denial, no external floor
    if: ${{ github.repository == 'ngluonghoa/MST' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-locked package
        run: python -m pip install -e ".[custody]"
      - name: Execute V1 numerical oracle backed V2 candidate manifest chain
        run: |
          python -m scripts.m2_a03_v2_full_policy_manifest_draft \
            --out /tmp/mst-v2-full-policy-manifest-local-chain-no-auth.json
      - name: Archive temporary untrusted design evidence only
        uses: actions/upload-artifact@v4
        with:
          name: mst-a03-manifest-full-policy-local-chain-NO-AUTH
          path: /tmp/mst-v2-full-policy-manifest-local-chain-no-auth.json
          retention-days: 14
          if-no-files-found: error
