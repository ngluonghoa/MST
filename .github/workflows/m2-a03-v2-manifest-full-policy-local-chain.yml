              assert proof[flag] is False,flag
          print("ASOF M3/M4 CUSTODY LAB SYNTHETIC PASS; REAL ISSUER AND GOOGLE DRIVE CACHE NO-GO")
          PY
      - name: Run 47 fictional calendar-as-of revision and six-TF quarantine tests
        run: python -m unittest discover -s tests -p 'test_m4_v21_calendar_revision_quarantine_lab.py' -v
      - name: Validate two retro calendar revisions and deny all source or market authority
